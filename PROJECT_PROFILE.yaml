schema_version: 6

project:
  repo: rasokiwayami/openlongpdf-translator
  type: supporting_tool
  domain: document_translation
  primary_goal: Local-first long PDF extraction and page-aware translation-note workflow
  default_branch: main
  visibility: private_or_public_per_current_remote
  authority:
    # These are target-local filters; central authority and task evidence still decide execution.
    allowed_actions:
      - dev.local_inspect
      - dev.local_edit
      - dev.local_test
      - dev.local_commit
      - dev.github_push
      - dev.github_pr_or_issue
    forbidden_actions:
      - dev.repo_create_visibility_deploy_or_publish
      - dev.secret_or_security_mutation
      - dev.production_data_mutation
      - auth.secret_read_or_print
      - finance.spending_or_paid_service_change
      - dev.destructive_action

runtime:
  local_only: true
  deployment: none
  languages:
    - python
  package_managers:
    - uv
  operating_environment:
    - Mac local operation under /Users/sora/dev/openlongpdf-translator
    - Legacy Windows/WSL operation remains a normal Python/uv context

verification:
  default:
    - uv run --extra dev python -m pytest
  formatting:
    - git diff --check

state:
  ignored_runtime_dirs:
    - .venv/
    - .pytest_cache/
    - output/
    - dist/
    - build/
  canonical_progress:
    - AGENTS.md
    - PROJECT_PROFILE.yaml
    - pyproject.toml
    - src/
    - tests/
